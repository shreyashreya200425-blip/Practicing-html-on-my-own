<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Form</title>
</head>
<body>
    <h1>Hotel Sunrise Feedback</h1>
    <form action="https://example.com/survey" method="post">
        <fieldset>
            <legend>Was this your first time at our hotel?</legend>
            <label for="yes-option">Yes</label>
            <input 
            id="yes-option"
            type="radio"
            name="first-stay"
            value="yes">

            <label for="No-option">No</label>
            <input 
            id="no-option"
            type="radio"
            name="first-stay"
            value="no">
        </fieldset>

        <fieldset>
            <legend>What did you like most? (Check all that apply)</legend>
            <label for="checkbox"></label>
        </fieldset>
    </form>
</body>
</html>
