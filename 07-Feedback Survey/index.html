<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Form</title>
</head>
<body>
    <h1>Hotel Sunrise Feedback</h1>
    <form action="https://example.com/survey" method="post">
        <fieldset>
            <legend>Was this your first time at our hotel?</legend>
            <label for="yes-option">Yes</label>
            <input 
            id="yes-option"
            type="radio"
            name="first-stay"
            value="yes">

            <label for="no-option">No</label>
            <input 
            id="no-option"
            type="radio"
            name="first-stay"
            value="no">
<br>
            <legend>How was the room service?</legend>
            <label for="good-option">Good</label>
            <input 
            id="good-option"
            type="radio"
            name="room-service"
            value="good">

            <label for="average-option">Average</label>
            <input 
            id="average-option"
            type="radio"
            name="room-service"
            value="average">

            <label for="bad-option">Bad</label>
            <input 
            id="bad-option"
            type="radio"
            name="room-service"
            value="bad">
        </fieldset>

        <fieldset>
            <legend>What did you like most? (Check all that apply)</legend>
            <label for="checkbox">Food</label>
            <input type="checkbox"
            id="checkbox"
            name="food"
            value="food">    

            <label for="checkbox">Pool</label>
            <input type="checkbox"
            id="checkbox"
            name="pool"
            value="pool"> 

            <label for="checkbox">Location</label>
            <input type="checkbox"
            id="checkbox"
            name="location"
            value="location"> 

            <label for="checkbox">Staff</label>
            <input type="checkbox"
            id="checkbox"
            name="staff"
            value="staff"> 
<br>
            <lable for="name">Your Name</lable>
            <input 
            type="text"
            id="name"
            name="name"
            value="text">
        </fieldset>

        <button>Submit</button>
    </form>
</body>
</html>
