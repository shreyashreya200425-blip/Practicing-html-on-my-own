<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym membership</title>
</head>
<body>
    <h1>Join IronCore Gym</h1>
    <form action="https://example.com/signup" method="post">
        <input 
        type="text"
        id="name"
        name="name"
        placeholder="e.g. Rahul Sharma"
        size="25"
        minlength="5"
        maxlength="30"
        required>

    <input
        type="email"
        id="email"
        name="email"
        placeholder="rahul@email.com"
        required>

    <input
        type="number"
        id="month"
        name="month"
        min="1"
        max="12">

    <input
        type="number"
        id="age"
        name="age"
        min="0"
        max="60">

    <input
        type="text"
        id="membership-plan"
        name="membership-plan"
        placeholder="e.g. Monthly, Yearly"
        value="Standard"
        readonly>
    
    <input
        type="text"
        disabled
        id="promocode"
        name="promocode">

    <input
        type="submit"
        value="Join now">
    </form>
</body>
</html>
